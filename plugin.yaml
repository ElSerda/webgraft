name: webgraft
version: 0.3.0
manifest_version: 2
api_version: 1
description: "Local page and document reading for web_extract, and the pages opened for the answer, as clickable sources"
author: ElSerda
license: MIT
requires_hermes: ">=0.22.6"
tags: [web, research, citations, sources, extraction]
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - transform_llm_output
provides_web_providers:
  - webgraft
config_schema:
  show_sources:
    type: str
    choices: [always, never]
    default: always
    label: List opened pages
    description: "always adds the footer of opened pages; never turns it off. Hermes keeps one rewrite of a reply: with another plugin that rewrites replies, choose which one shows"
  remind:
    type: bool
    default: true
    label: Remind the model to open pages
    description: "Adds a short reminder (about 110 tokens) to each user message: search snippets are not sources, open the pages"
  one_url_per_call:
    type: bool
    default: true
    label: One URL per web_extract call
    description: "A web_extract call that asks for several URLs reads only the first, and its result lists the others: several long pages in one result can exceed a small model's context"
  llms_txt:
    type: bool
    default: true
    label: Use the site's llms.txt
    description: "When a site's llms.txt lists a Markdown (.md) version of the page, read that instead of the HTML; checked once per hour per site"
  tool_guard:
    type: str
    choices: [ask, block, off]
    default: ask
    label: Guard tools after web content
    description: "A web page can hold instructions aimed at the assistant. Once the conversation has read web or MCP content, tools that are not read-only (terminal, code, browser, file writes, messages, session_search, and file, image or video reads outside the folders where Hermes keeps fetched pages) go to Hermes's approval prompt (ask; refused where nobody can answer, such as -Q or cron) or are refused (block). Under --yolo or approvals off Hermes approves by itself: use block"
  keyless_rescue:
    type: str
    choices: [ask, block, off]
    default: ask
    label: Ask before Hermes's keyless rescue
    description: "When webgraft cannot read a page (or the search backend fails), Hermes's keyless rescue (web.keyless_rescue, on by default) sends the URL or the search to an outside service: Exa, Parallel, Firecrawl or Keenable. ask: webgraft keeps the page here, and the model can ask for it again, which goes to Hermes's approval prompt; after a rescued search, the next searches are asked about until the backend answers again. block: never sent. off: Hermes decides. Under --yolo or approvals off Hermes approves by itself: use block"
  respect_ai_optout:
    type: bool
    default: true
    label: Respect AI opt-outs
    description: "A page that asks not to be used by AI (noai in X-Robots-Tag or a robots meta tag, or tdm-reservation: 1) comes back as an error instead of content"
